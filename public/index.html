<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Député virtuel — Votez les lois</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <h1>🏛️ Député virtuel</h1>
    <p class="tagline">Lisez le résumé de l'IA, puis votez les propositions de loi.</p>
  </header>

  <main id="lois">
    <p class="chargement">Chargement des propositions de loi…</p>
  </main>

  <template id="carte-loi">
    <article class="carte">
      <h2 class="titre"></h2>
      <p class="expose"></p>
      <ul class="points"></ul>
      <div class="actions">
        <button class="vote pour" data-choix="pour">👍 Pour</button>
        <button class="vote contre" data-choix="contre">👎 Contre</button>
        <button class="vote abstention" data-choix="abstention">🤍 Abstention</button>
        <button class="resume-ia">🤖 Résumé de l'IA</button>
      </div>
      <div class="resultats">
        <div class="barre"><span class="remplissage"></span></div>
        <p class="detail"></p>
      </div>
      <blockquote class="ia" hidden></blockquote>
    </article>
  </template>

  <script src="app.js"></script>
</body>
</html>
