services:
  db:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_USER: depute
      POSTGRES_PASSWORD: depute
      POSTGRES_DB: depute
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U depute"]
      interval: 5s
      retries: 10

  api:
    build: .
    depends_on:
      db: { condition: service_healthy }
    environment:
      DATABASE_URL: postgresql://depute:depute@db:5432/depute
    env_file: [.env]
    ports: ["8000:8000"]

volumes:
  pgdata:
