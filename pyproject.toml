[project]
name = "depute-virtuel"
version = "0.1.0"
description = "Extraction et vérification des propositions de loi et amendements (open data AN)"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.32",
    "pydantic>=2.9",
    "httpx>=0.27",
    "mistralai>=1.5",
    "anthropic>=0.40",
    "sqlmodel>=0.0.22",
    "psycopg[binary,pool]>=3.2",
    "pgvector>=0.3",
    "typer>=0.12",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-cov>=6.0",
    "ruff>=0.7",
    "respx>=0.21",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.setuptools.packages.find]
where = ["src"]
